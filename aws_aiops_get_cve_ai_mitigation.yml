---

- name: Get AI generated Mitigation Code
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: vars/main.yml
  tasks:
    # - name: Fetch CVE data from Red Hat Security Data API
    #   ansible.builtin.uri:
    #     url: "https://access.redhat.com/hydra/rest/securitydata/cve/{{ cve_name }}.json"
    #     method: GET
    #     return_content: true
    #     status_code: 200
    #   register: cve_response

    # - name: Display CVE details
    #   ansible.builtin.debug:
    #     var: cve_response.json

    # - name: Set the CVE Details
    #   ansible.builtin.set_fact:
    #     cve_details: "{{ cve_response.json.details | default('No details available for this CVE.') }}"

    # - name: Display CVE Mitigation
    #   ansible.builtin.set_fact:
    #     cve_mitigation: "{{ cve_response.json.mitigation.value | default('No mitigation available for this CVE.') }}"

    # - name: Set fact prompt
    #   ansible.builtin.set_fact:
    #     prompt: >
    #             Write an ansible playbook to mitigate CVE {{ cve_name }}.
    #             You MUST the following list of hosts as playbook targets: 
    #             '{{ affected_systems_fqdn | join(',') }}'.
    #             You MUST NOT use block structure on handlers.
    #             You MUST use ignore_errors: true to make the playbook always succeed.
    #             The CVE has the following details and mitigation descriptions:
    #             Details: '{{ cve_details }}'.
    #             Mitigation: '{{ cve_mitigation }}'.

    - name: Download Red Hat CVE page
      ansible.builtin.uri:
        url: "https://access.redhat.com/security/cve/{{ cve_name }}"
        method: GET
        return_content: true
        status_code: 200
      register: cve_page

    - name: Extract RHSB URL
      ansible.builtin.set_fact:
        rhsb_url: >-
          {{
            cve_page.content
            | regex_search(
                'https://access\\.redhat\\.com/security/vulnerabilities/RHSB-[0-9]{4}-[0-9]+'
              )
          }}

    - name: Debug RHSB URL
      debug:
        var: rhsb_url

    - name: Download RHSB page
      ansible.builtin.uri:
        url: "{{ rhsb_url }}"
        method: GET
        return_content: true
        status_code: 200
      register: rhsb_page

    - name: Debug HTML
      debug:
        var: rhsb_page.content

    - name: Extract Executive Summary
      ansible.builtin.set_fact:
        executive_summary: >-
          {{
            rhsb_page.content
            | regex_search(
                '(?is)Executive Summary.*?</h2>(.*?)<h2',
                '\\1'
              )
            | regex_replace('<[^>]+>', '')
            | regex_replace('&nbsp;', ' ')
            | trim
          }}

    - name: Debug Executive Summary
      debug:
        var: executive_summary



    - name: Prompt Openshift AI
      ansible.builtin.uri:
        url: "{{ ai_endpoint }}"
        method: POST
        body:
          model: "{{ ai_model }}"
          messages: 
            - content: "{{ prompt }}"
        status_code: 200
        body_format: json
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ ai_token }}"
        validate_certs: yes
      register: ai_response
      retries: 10
      delay: 5
      until: ai_response.status == 200

    - name: Debug Prompt to Openshift AI
      debug:
        var: ai_response

    - name: Set Generated Ansible Playbook
      ansible.builtin.set_fact:
        generated_playbook: >-
          {{ ai_response.json.choices[0].message.reasoning_content |
          wordwrap(60) |
          comment('plain', prefix='####### REASONING #######', postfix='#######') }}
          
          {{ ai_response.json.choices[0].message.content
             .split('```yaml')[1].split('```')[0] | trim }}

    - name: Debug generated Playbook
      ansible.builtin.debug:
        var: generated_playbook

    - name: Set stats generated Playbook
      ansible.builtin.set_stats:
        data:
          generated_playbook: "{{ generated_playbook }}"

